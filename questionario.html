<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas — Il tuo percorso</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 45px;
        }

        .progress {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .intro {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 35px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            text-align: left;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">ATLAS</div>

        <div class="progress">
    Domanda 1 di 7
</div>

<h1>
    A che punto siete oggi nel vostro percorso?
</h1>

<p class="intro">
    Non importa se avete già fatto molto o se siete appena all'inizio.
    Ci serve solo capire da dove partire per orientarvi.
</p>

        <div class="options">

    <button class="option" onclick="vaiAllaDomanda2('dubbi')">
        Abbiamo dei dubbi e stiamo cercando di capire cosa sta succedendo
    </button>

    <button class="option" onclick="vaiAllaDomanda2('diagnosi')">
        Siamo in fase di valutazione o stiamo cercando una diagnosi
    </button>

    <button class="option" onclick="vaiAllaDomanda2('post_diagnosi')">
        Abbiamo appena ricevuto una diagnosi
    </button>

    <button class="option" onclick="vaiAllaDomanda2('percorso_avviato')">
        Abbiamo già iniziato un percorso
    </button>

    <button class="option" onclick="vaiAllaDomanda2('nuove_difficolta')">
        Abbiamo già un percorso, ma stiamo incontrando nuove difficoltà
    </button>

</div>

        <div class="footer">
            Atlas utilizza le tue risposte per aiutarti a individuare
            possibili prossimi passi.
        </div>

    </main>
<script>
    function vaiAllaDomanda2(risposta) {
        window.location.href = "domanda2.html?risposta=" + risposta;
    }
</script>
</body>
</html>
