<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas — Il tuo percorso</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 45px;
        }

        .progress {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .intro {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            text-align: left;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">ATLAS</div>

        <div class="progress">
            Domanda 2 di 7
        </div>

        <h1 id="titolo"></h1>

        <p class="intro" id="intro"></p>

        <div class="options" id="opzioni"></div>

        <div class="footer">
            Non esiste una risposta giusta o sbagliata.
        </div>

    </main>

    <script>

        // Recupera la risposta data alla Domanda 1
        const parametri = new URLSearchParams(window.location.search);
        const fase = parametri.get("risposta");

        const titolo = document.getElementById("titolo");
        const intro = document.getElementById("intro");
        const opzioni = document.getElementById("opzioni");

        let domanda = "";
        let risposte = [];

        // DUBBI INIZIALI
        if (fase === "dubbi") {

            domanda = "Cosa vi preoccupa maggiormente in questo momento?";

            risposte = [
                "Ci preoccupa lo sviluppo o il comportamento di nostro figlio",
                "Non sappiamo a chi rivolgerci per capire meglio la situazione",
                "Abbiamo bisogno di informazioni semplici e affidabili",
                "Non sappiamo quale sia il prossimo passo da fare",
                "Abbiamo già iniziato a cercare aiuto, ma siamo ancora disorientati",
                "Altro"
            ];

        // DIAGNOSI IN CORSO
        } else if (fase === "diagnosi") {

            domanda = "Di cosa avete più bisogno mentre affrontate questo percorso?";

            risposte = [
                "Trovare un professionista o una struttura",
                "Capire come funziona il percorso di valutazione",
                "Capire quali sono i tempi e le possibilità disponibili",
                "Trovare informazioni affidabili",
                "Capire cosa possiamo fare nel frattempo",
                "Non sappiamo quale sia il prossimo passo",
                "Altro"
            ];

        // POST DIAGNOSI
        } else if (fase === "post_diagnosi") {

            domanda = "Cosa vi serve maggiormente per capire come procedere dopo la diagnosi?";

            risposte = [
                "Capire da dove iniziare",
                "Trovare professionisti o terapie",
                "Conoscere i servizi disponibili nella nostra zona",
                "Capire quali sostegni e agevolazioni possiamo avere",
                "Capire come muoverci con la scuola",
                "Trovare informazioni semplici e affidabili",
                "Non sappiamo quale sia il prossimo passo",
                "Altro"
            ];

        // PERCORSO GIÀ AVVIATO
        } else if (fase === "percorso_avviato") {

            domanda = "Cosa vi manca maggiormente nel percorso che avete già iniziato?";

            risposte = [
                "Trovare o cambiare professionisti o servizi",
                "Organizzare meglio terapie e appuntamenti",
                "Gestire meglio il rapporto con la scuola",
                "Trovare informazioni che ancora ci mancano",
                "Capire quali sostegni o agevolazioni possiamo ottenere",
                "Coordinare meglio le diverse persone che seguono nostro figlio",
                "Il percorso non sta funzionando come speravamo",
                "Altro"
            ];

        // NUOVE DIFFICOLTÀ
        } else if (fase === "nuove_difficolta") {

            domanda = "Qual è la principale difficoltà che state incontrando adesso?";

            risposte = [
                "Terapie e organizzazione familiare",
                "Scuola",
                "Professionisti o servizi",
                "Costi",
                "Tempi di attesa",
                "Burocrazia, diritti o agevolazioni",
                "Comunicazione e coordinamento tra famiglia e professionisti",
                "È comparsa una nuova difficoltà nel comportamento o nello sviluppo",
                "Altro"
            ];

        } else {

            // Caso di sicurezza se qualcuno apre direttamente domanda2.html
            domanda = "Di cosa avete più bisogno in questo momento?";

            risposte = [
                "Capire da dove iniziare",
                "Trovare professionisti o servizi",
                "Conoscere le risorse disponibili nella nostra zona",
                "Trovare informazioni semplici e affidabili",
                "Capire quali sostegni possiamo avere",
                "Altro"
            ];
        }

        // Inserisce il contenuto nella pagina
        titolo.textContent = domanda;

        intro.textContent =
            "Scegli la risposta che descrive meglio ciò di cui avete bisogno in questo momento. " +
            "La vostra risposta aiuterà Atlas a capire come orientarvi.";

        // Crea i pulsanti
        risposte.forEach(function(risposta) {

            const bottone = document.createElement("button");

            bottone.className = "option";
            bottone.textContent = risposta;

            bottone.addEventListener("click", function() {

                // Per ora registriamo la risposta e passiamo alla Domanda 3
                const valore = encodeURIComponent(risposta);

                window.location.href =
                    "domanda3.html?fase=" +
                    encodeURIComponent(fase) +
                    "&bisogno=" +
                    valore;

            });

            opzioni.appendChild(bottone);
        });

    </script>

</body>
</html>
