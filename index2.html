<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — F1 Test</title>
</head>

<body>
  <h1>Atlas — Interpretation Engine v0.2.1</h1>

  <h2>Test 2 — F1</h2>

  <p>
    Ricostruzione minimale basata esclusivamente sugli elementi F1
    conservati nel progetto Atlas.
  </p>

  <pre id="output">Elaborazione...</pre>

  <script src="atlas-data.js"></script>
  <script src="atlas-engine.js"></script>

  <script>
    const testInput = {
      phase: "post_diagnosi",

      // F1: difficoltà nel capire come procedere dopo la diagnosi.
      need: "non so da dove iniziare",

      // Non assumiamo risorse non documentate.
      resources: [],

      // Problema centrale ricostruito da F1.
      gaps: ["informazione/orientamento"],

      // Il reperimento del primo centro ha richiesto più di un anno.
      barriers: ["attesa troppo lunga"],

      // Intento Atlas coerente con il caso.
      intent: "orientarsi",

      comune: "",
      provincia: "",
      distance: "",
      online: ""
    };

    const result = window.AtlasEngine.buildProfile(testInput);

    document.getElementById("output").textContent =
      JSON.stringify(result, null, 2);
  </script>
</body>
</html>
