<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — F2 Test</title>
</head>

<body>
  <h1>Atlas — Interpretation Engine v0.2.1</h1>

  <h2>Test 3 — F2</h2>

  <p>
    Ricostruzione minimale basata esclusivamente sugli elementi F2
    conservati nel progetto Atlas.
  </p>

  <pre id="output">Elaborazione...</pre>

  <script src="atlas-data.js"></script>
  <script src="atlas-engine.js"></script>

  <script>
    const testInput = {
      phase: "percorso_avviato",

      // F2: bambino con autismo non verbale e ritardo dello sviluppo.
      need: "cercare professionisti e servizi",

      // Risorse effettivamente ricordate dal percorso F2.
      resources: [
        "specialist",
        "center"
      ],

      // Il caso documenta una rete di professionisti/strutture.
      gaps: [],

      barriers: [],

      // Intento principale ricostruito: ricerca di professionisti/servizi.
      intent: "cercare",

      comune: "",
      provincia: "",
      distance: "",
      online: ""
    };

    const result = window.AtlasEngine.buildProfile(testInput);

    document.getElementById("output").textContent =
      JSON.stringify(result, null, 2);
  </script>
</body>
</html>
